name: Windows Python 3.12 CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-python312-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 · PySide6 · Windows
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          python-version: "3.12"
          enable-cache: true

      - name: Resolve and validate dependency lockfile
        run: |
          uv lock
          uv lock --check

      - name: Note whether the repository lockfile needs committing
        shell: pwsh
        run: |
          git diff --quiet -- uv.lock
          if ($LASTEXITCODE -ne 0) {
            "**Dependency lockfile:** the runner refreshed `uv.lock`. Download the `uv-lockfile-windows-python312` artifact and commit the refreshed file to the repository." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "**Dependency lockfile:** committed `uv.lock` is synchronized." >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify Python, dependencies, and Qt offscreen runtime
        run: uv run python scripts/verify_environment.py --require-pyside6 --require-qt-offscreen

      - name: Ruff
        run: uv run ruff check .

      - name: Compile Python sources
        run: uv run python -m compileall -q app features tests tools scripts

      - name: Prepare test report directory
        run: New-Item -ItemType Directory -Force -Path tests/reports | Out-Null

      - name: Run complete test suite
        run: uv run pytest -v --junitxml=tests/reports/junit-windows-py312.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-windows-python312
          path: tests/reports/junit-windows-py312.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uv-lockfile-windows-python312
          path: uv.lock
          if-no-files-found: error
          retention-days: 14
