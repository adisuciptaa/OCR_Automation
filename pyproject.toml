[project]
name = "ocr-automation"
version = "0.1.3"
description = "Offline-first modular OCR automation Windows desktop application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyside6>=6.10,<7",
    "cryptography>=44,<47",
    "pypdfium2>=4.30,<6",
    "Pillow>=10,<13",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26,<3",
    "pytesseract>=0.3.13,<0.4",
    "openpyxl>=3.1,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
